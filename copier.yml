_subdirectory: template
project_name:
  type: str
  help: What is your project name?

project_type:
  type: str
  help: What kind of project is this?
  choices:
    Data Science (adds models, feature engineering to src/): data_science
    Data Analysis (src/ has just data + visualization): data_analysis
  default: data_analysis

include_module:
  type: bool
  help: Include a Python module for shared functions/classes across notebooks?
  default: true

module_name:
  type: str
  help: What is your Python module name?
  default: "{{ project_name|lower|replace('-', '_') }}"
  when: "{{ include_module }}"

include_notebooks:
  type: bool
  help: Include a notebooks/ directory for Jupyter notebooks?
  default: true

include_reports:
  type: bool
  help: Include a reports/ directory for write-ups and figures?
  default: true

python_version:
  type: str
  help: what is your python version?
  default: 3.14.7

github_actions:
  type: bool
  help: Add Github Actions CI (lint/test checks, plus release-please + git-cliff versioning and changelog automation)?
  default: true

use_rumdl:
  type: bool
  help: Include markdown linting?
  default: true

publish_to_pypi:
  type: bool
  help: Add a GitHub Actions job to publish this package to PyPI on release?
  default: false
  when: "{{ include_module and github_actions }}"

_skip_if_exists:
  - "notebooks/**"
  - "reports/**"
  - "src/**"

_exclude:
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "{% if _copier_operation == 'update' %}notebooks{% endif %}"
  - "{% if _copier_operation == 'update' %}reports{% endif %}"
  - "{% if _copier_operation == 'update' %}src{% endif %}"

# copy only: on update it runs before local changes are re-applied.
_tasks:
  - command: "just setup"
    when: "{{ _copier_operation == 'copy' }}"
