_subdirectory: template

# Defaults that read project_type, include_*, github_actions, or use_rumdl map
# pre-v2 answers on `copier update`; on a fresh copy those are undefined.

project_name:
  type: str
  help: Project name (Proper Case or snake_case)
  validator: >-
    {% if not (project_name | regex_search('^[A-Za-z][A-Za-z0-9 _-]*$')) %}
    Start with a letter; use letters, digits, spaces, _ or -.
    {% endif %}

# snake_case: pyproject name, default module name, repo name.
project_slug:
  type: str
  when: false
  default: >-
    {{ project_name
       | regex_replace('(?<=[a-z0-9])(?=[A-Z])', '_')
       | lower
       | regex_replace('[^a-z0-9]+', '_')
       | regex_replace('^_+|_+$', '') }}

# Display name: snake/kebab input is title-cased, anything else kept as typed.
project_title:
  type: str
  when: false
  default: >-
    {% if project_name | regex_search('^[a-z0-9_-]+$') -%}
    {{ project_name | replace('_', ' ') | replace('-', ' ') | title }}
    {%- else -%}
    {{ project_name }}
    {%- endif %}

module_name_source:
  type: str
  help: Python module name
  choices:
    "Project name (snake_case)": project
    Custom: custom
  default: "{{ 'custom' if (module_name is defined and module_name != project_slug) else 'project' }}"

module_name:
  type: str
  help: Module name
  default: "{{ project_slug }}"
  when: "{{ module_name_source == 'custom' }}"
  validator: >-
    {% if not (module_name | regex_search('^[a-z_][a-z0-9_]*$')) %}
    Must be a lowercase Python identifier.
    {% endif %}

structure:
  type: str
  multiselect: true
  help: Project structure
  choices:
    "src/<module>/data": data
    "src/<module>/visualization": visualization
    "src/<module>/features": features
    "src/<module>/models": models
    notebooks/: notebooks
    reports/: reports
  default: >-
    {{ (['data', 'visualization']
        + (['features', 'models'] if project_type | default('data_analysis') == 'data_science' else [])
        + (['notebooks'] if include_notebooks | default(true) else [])
        + (['reports'] if include_reports | default(true) else [])) | tojson }}

python_version:
  type: str
  help: Python version
  default: 3.14.7

tooling:
  type: str
  multiselect: true
  help: Tooling
  choices:
    "GitHub Actions: lint + tests": github_actions
    "Releases: release-please + git-cliff (needs Actions)": releases
    "rumdl: markdown linting": rumdl
    "Renovate: dependency PRs (needs the Renovate app)": renovate
    "Semgrep: scanning (needs Actions + SEMGREP_APP_TOKEN)": semgrep
  default: >-
    {{ ((['github_actions', 'releases'] if github_actions | default(true) else [])
        + (['rumdl'] if use_rumdl | default(true) else [])
        + ['renovate']) | tojson }}
  validator: >-
    {% for opt in ['releases', 'semgrep'] if opt in tooling and 'github_actions' not in tooling %}
    {{ opt }} needs GitHub Actions.
    {% endfor %}

publish_to_pypi:
  type: bool
  help: Publish to PyPI on release?
  default: false
  when: "{{ 'github_actions' in tooling }}"

_skip_if_exists:
  - "README.md"
  - "notebooks/**"
  - "reports/**"
  - "src/**"
  - "tests/**"

_exclude:
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - "{% if _copier_operation == 'update' %}notebooks{% endif %}"
  - "{% if _copier_operation == 'update' %}reports{% endif %}"
  - "{% if _copier_operation == 'update' %}src{% endif %}"
  - "{% if _copier_operation == 'update' %}tests{% endif %}"

# copy only: on update it runs before local changes are re-applied.
_tasks:
  - command: "just setup"
    when: "{{ _copier_operation == 'copy' }}"
