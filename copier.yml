_subdirectory: template
project_name:
  type: str
  help: What is your project name?

module_name:
  type: str
  help: What is your Python module name?
  default: "{{ project_name|lower|replace('-', '_') }}"

python_version:
  type: str
  help: what is your python version?
  default: 3.12

github_actions:
  type: bool
  help: Add github actions
  default: false

use_prek:
  type: bool
  help: Use prek instead of pre-commit for checks
  default: true

use_rumdl:
  type: bool
  help: Use rumdl instead of markdownlint-cli2 for markdown checks
  default: true
