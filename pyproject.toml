[project]
name = "python-copier-template-ds"
version = "2.1.0"
description = "Dev tooling for the python-copier-template-ds Copier template (not a package)"
requires-python = ">=3.14.7"
dependencies = []

[tool.uv]
# 7-day supply-chain cooldown, first in tool.uv for Semgrep
exclude-newer = "7 days"
package = false

[dependency-groups]
dev = [
    "copier>=9.17.2",
    "copier-template-tester>=3.0.0",
    "j2lint>=1.3.0",
    "rumdl>=0.2.62",
    "yamllint>=1.38.0",
]

[tool.rumdl]
disable = ["MD013"]
exclude = [".ctt", "CHANGELOG.md"]
