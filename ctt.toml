[defaults]
project_name = "ctt-test"
_skip_tasks = true

[output.".ctt/no-ci"]
tooling = []

[output.".ctt/ci"]
tooling = ["github_actions", "releases", "rumdl", "renovate", "semgrep"]

[output.".ctt/no-notebooks"]
structure = ["data", "visualization", "reports"]
tooling = ["github_actions", "releases"]

[output.".ctt/data-science"]
project_name = "Data Science Test"
structure = ["data", "visualization", "features", "models", "notebooks", "reports"]
module_name_source = "custom"
module_name = "ds_pkg"
tooling = ["github_actions", "rumdl"]
publish_to_pypi = true

[output.".ctt/minimal"]
structure = []
tooling = []
